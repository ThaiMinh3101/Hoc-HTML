            border-radius: 6px;

            cursor: pointer;
            font-weight: 500;

            background-color: #e5e7eb;
        }

            color: #4b5563;
            font-size: 16px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            font-family: inherit;
        }

            background-color: #f9fafb;
            border-color: #d1d5db;
        }
        .option.correct {
            background-color: #22c55e !important;
            color: white !important;
            border-color: #22c55e !important;
        }
        .option.incorrect {
            background-color: #ef4444 !important;
            color: white !important;
            border-color: #ef4444 !important;
        }
        .option:disabled {
            cursor: default;
        }
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 35px;
            min-height: 40px;
        }
        .feedback {
            font-size: 16px;
            font-weight: 500;
        }
        .feedback.wrong {
            color: #ef4444;
        }
        .feedback.correct {
            color: #22c55e;
        }
        .next-btn {
            background-color: #2563eb;
            color: white;
            padding: 10px 24px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s;
            font-family: inherit;
        }
        .next-btn:hover:not(:disabled) {
            background-color: #1d4ed8;
        }
        .next-btn:disabled {
            opacity: 0;
            pointer-events: none;
        }

            text-align: center;
        }
        .score-container h2 {
            color: #111827;
            margin-bottom: 10px;
        }
        .score-container p {
            color: #4b5563;
            font-size: 18px;

        }

            background-color: #22c55e;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;

            font-weight: 500;

\u1ee7a s\u1ef1 ki\u1ec7n keydown kh\u00f4ng b\u1ecb \u1ea3nh h\u01b0\u1edfng b\u1edfi Shift/Caps Lock", "keypress \u0111\u00e3 b\u1ecb lo\u1ea1i b\u1ecf trong c\u00e1c phi\u00ean b\u1ea3n m\u1edbi c\u1ee7a JavaScript v\u00e0 kh\u00f4ng n\u00ean s\u1eed d\u1ee5ng, trong khi keydown v\u1eabn \u0111\u01b0\u1ee3c h\u1ed7 tr\u1ee3", "T\u1ea5t c\u1ea3 \u0111\u1ec1u \u0111\u00fang"], "answer": 3}, {"question": "S\u1ef1 kh\u00e1c nhau gi\u1eefa s\u1ef1 ki\u1ec7n input v\u00e0 change tr\u00ean ph\u1ea7n t\u1eed &lt;input&gt; trong JavaScript l\u00e0 g\u00ec:", "options": ["input \u0111\u01b0\u1ee3c k\u00edch ho\u1ea1t khi ng\u01b0\u1eddi d\u00f9ng nh\u1eadp ho\u1eb7c s\u1eeda \u0111\u1ed5i gi\u00e1 tr\u1ecb trong \u00f4 input, trong khi change \u0111\u01b0\u1ee3c k\u00edch ho\u1ea1t khi ng\u01b0\u1eddi d\u00f9ng thay \u0111\u1ed5i gi\u00e1 tr\u1ecb v\u00e0 m\u1ea5t focus kh\u1ecfi \u00f4 input", "input ch\u1ec9 \u0111\u01b0\u1ee3c k\u00edch ho\u1ea1t khi ng\u01b0\u1eddi d\u00f9ng nh\u1eadp d\u1eef li\u1ec7u b\u1eb1ng b\u00e0n ph\u00edm, trong khi change \u0111\u01b0\u1ee3c k\u00edch ho\u1ea1t khi ng\u01b0\u1eddi d\u00f9ng thay \u0111\u1ed5i gi\u00e1 tr\u1ecb b\u1eb1ng b\u1ea5t k\u1ef3 ph\u01b0\u01a1ng th\u1ee9c n\u00e0o (b\u00e0n ph\u00edm, chu\u1ed9t, d\u00e1n, v.v.)", "input kh\u00f4ng \u0111\u01b0\u1ee3c k\u00edch ho\u1ea1t n\u1ebfu d\u00f9ng JavaScript \u0111\u1ec3 thay \u0111\u1ed5i gi\u00e1 tr\u1ecb c\u1ee7a \u00f4 input, trong khi change v\u1eabn \u0111\u01b0\u1ee3c k\u00edch ho\u1ea1t", "Kh\u00f4ng c\u00f3 s\u1ef1 kh\u00e1c nhau n\u00e0o, c\u1ea3 hai \u0111\u1ec1u ho\u1ea1t \u0111\u1ed9ng gi\u1ed1ng nhau"], "answer": 0}];
        let questions = JSON.parse(JSON.stringify(originalQuestions));
        
        let currentQuestionIndex = 0;
        let score = 0;

        const appElement = document.getElementById("app");
        
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function shuffleQuestions() {
            shuffleArray(questions);
            currentQuestionIndex = 0;
            score = 0;
            renderQuestion();
        }

        function renderQuestion() {
            if (currentQuestionIndex >= questions.length) {
                renderScore();
                return;
            }

            const q = questions[currentQuestionIndex];
            
            let optionsHtml = "";
            q.options.forEach((opt, index) => {
                optionsHtml += `<button class="option" onclick="checkAnswer(${index}, this)">${opt}</button>`;
            });

            appElement.innerHTML = `
                <div class="header">
                    <h1 class="title">🚀 Ôn Thi Lập Trình Web</h1>
                </div>
                <div class="controls">
                    <button class="shuffle-btn" onclick="shuffleQuestions()">🔀 Xáo trộn câu hỏi</button>
                    <div class="counter">Câu ${currentQuestionIndex + 1}/${questions.length}</div>
                </div>
                <div class="question">${q.question}</div>
                <div class="options" id="options-container">
                    ${optionsHtml}
                </div>
                <div class="footer">
                    <div class="feedback" id="feedback"></div>
                    <button class="next-btn" id="next-btn" onclick="nextQuestion()" disabled>Câu Tiếp Theo</button>
                </div>
            `;
        }

        function checkAnswer(selectedIndex, btnElement) {
            const q = questions[currentQuestionIndex];
            const isCorrect = (selectedIndex === q.answer);
            const optionsContainer = document.getElementById("options-container");
            const allOptions = optionsContainer.getElementsByClassName("option");
            const feedback = document.getElementById("feedback");
            const nextBtn = document.getElementById("next-btn");

            // Disable all options
            for (let i = 0; i < allOptions.length; i++) {
                allOptions[i].disabled = true;
                if (i === q.answer) {
                    allOptions[i].classList.add("correct");
                }
            }

            if (isCorrect) {
                feedback.textContent = "Chính xác! 🎉";
                feedback.className = "feedback correct";
                score++;
            } else {
                btnElement.classList.add("incorrect");
                feedback.textContent = "Sai rồi! 😅";
                feedback.className = "feedback wrong";
            }

            nextBtn.disabled = false;
        }

        function nextQuestion() {
            currentQuestionIndex++;
            renderQuestion();
        }

        function renderScore() {
            appElement.innerHTML = `
                <div class="score-container">
                    <h2>🎉 Hoàn Thành!</h2>
                    <p>Bạn đã trả lời đúng <strong>${score}</strong> / <strong>${questions.length}</strong> câu.</p>
                    <button class="restart-btn" onclick="restart(false)">Làm lại (Thứ tự cũ)</button>
                    <button class="restart-btn" onclick="restart(true)" style="background-color: #3b82f6;">Làm lại (Xáo trộn)</button>
                </div>
            `;
        }

        function restart(shuffle) {
            if (shuffle) {
                shuffleQuestions();
            } else {
                questions = JSON.parse(JSON.stringify(originalQuestions));
                currentQuestionIndex = 0;
                score = 0;
                renderQuestion();
            }
        }

        // Initial render
        renderQuestion();
    </script>
